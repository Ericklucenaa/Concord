name: CI + Deploy (Firebase Hosting)

# Every push/PR: lint, build, and run the security-rules + data-layer tests
# against the Firebase emulators. Pushes to main then deploy the web app to
# Firebase Hosting. Firestore rules/indexes are deployed by the maintainer with
# `firebase deploy --only firestore` (see README).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Lint
        working-directory: desktop
        run: npm run lint
      - name: Build
        working-directory: desktop
        run: npm run build
      - name: Unit tests
        working-directory: desktop
        run: npm run test:unit
      - name: Security rules & data-layer tests (Firebase emulators)
        working-directory: desktop
        run: npx --yes firebase-tools@15 emulators:exec --project demo-concord --only firestore,auth "npx vitest run"

  deploy:
    name: Deploy web app to Firebase Hosting
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Build
        working-directory: desktop
        env:
          VITE_TURN_URLS: ${{ secrets.VITE_TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
          VITE_TENOR_KEY: ${{ secrets.VITE_TENOR_KEY }}
          VITE_APPCHECK_SITE_KEY: ${{ secrets.VITE_APPCHECK_SITE_KEY }}
        run: npm run build
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: concord-3af70
